services:
  mongodb:
    image: mongo
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build: ./backendnew
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/your-db
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo-data: {}
